# Framework defaults. Override in src/test/resources/taf.properties, env/<env>.properties,
# -Dkey=value or environment variables (KEY_IN_UPPER_SNAKE_CASE).

# --- Target ---------------------------------------------------------------------------
# android | ios
platform=android
# local: Appium server already running at appium.url
# managed: the framework starts one Appium server per thread (needs `appium` on PATH)
# cloud: BrowserStack / Sauce Labs / LambdaTest (cloud.provider)
target=local
appium.url=http://127.0.0.1:4723
appium.new-command-timeout=120s
# managed target: extra Appium server arguments, e.g. --relaxed-security
appium.args=

# --- Devices --------------------------------------------------------------------------
# comma-separated udids for parallel runs; empty = whatever device Appium picks
devices=
device.lease-timeout=10m
# per-device ports are base + index (0, 1, 2, ...)
device.android.system-port-base=8200
device.ios.wda-port-base=8100
device.ios.mjpeg-port-base=9100

# --- Waits ----------------------------------------------------------------------------
wait.timeout=10s
wait.poll=250ms
wait.screen-timeout=20s

# --- Sessions -------------------------------------------------------------------------
# NEW_SESSION | RESTART_APP | RESET_APP_DATA | REUSE
session.default=RESTART_APP
session.after-failure=NEW_SESSION

# --- Artifacts ------------------------------------------------------------------------
artifacts.screenshot-on-failure=true
artifacts.page-source-on-failure=true
# off | on-failure | always
artifacts.video=off
artifacts.video.max-duration=5m

# --- Performance timings --------------------------------------------------------------
perf.enabled=true
perf.threshold.lookup=1s
perf.threshold.transition=3s
perf.fail=false

# --- Verification ---------------------------------------------------------------------
verify.mode=hard

# --- Retry: only infrastructure failures, never assertions ----------------------------
retry.max=1
retry.on=io.github.alexxfromgit.taf.mobile.core.failure.EnvironmentException,\
  org.openqa.selenium.SessionNotCreatedException,\
  java.net.ConnectException,\
  java.net.SocketTimeoutException

# --- Network mocking ------------------------------------------------------------------
mock.port=0

# --- Lint -----------------------------------------------------------------------------
lint.require-owner=true
lint.require-feature=true
lint.secrets=true
lint.screens=true
lint.quarantine.max-days=90

taf.secrets-guard.enabled=true
