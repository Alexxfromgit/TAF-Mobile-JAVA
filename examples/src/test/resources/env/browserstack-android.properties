# BrowserStack App Automate. Upload the app first and put its id here (bs://...).
# Credentials: CLOUD_USERNAME and CLOUD_ACCESS_KEY environment variables.
platform=android
target=cloud
cloud.provider=browserstack
cloud.app=bs://REPLACE_WITH_YOUR_APP_ID
cloud.options.deviceName=Google Pixel 8
cloud.options.osVersion=14.0
cloud.options.projectName=mobile-taf
cloud.options.buildName=mobile-taf examples
