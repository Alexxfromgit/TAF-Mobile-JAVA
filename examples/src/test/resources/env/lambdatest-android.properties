# LambdaTest Real Device Cloud. Upload the app first and put its id here (lt://...).
# Credentials: CLOUD_USERNAME and CLOUD_ACCESS_KEY environment variables.
platform=android
target=cloud
cloud.provider=lambdatest
cloud.app=lt://REPLACE_WITH_YOUR_APP_ID
cloud.options.deviceName=Pixel 8
cloud.options.platformVersion=14
cloud.options.isRealMobile=true
cloud.options.build=mobile-taf examples
