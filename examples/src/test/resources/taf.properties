# Project configuration for the Sauce Labs "My Demo App" examples.
# Select a target with -Denv=<file in env/>. Secrets never go here: use environment variables.
env=android-local

# Package name / bundle id: needed to restart or reset the app between tests
app.id.android=com.saucelabs.mydemoapp.android
app.id.ios=com.saucelabs.mydemo.app.ios

# Test users (public demo accounts printed on the app's login screen).
# Passwords come from USERS_STANDARD_PASSWORD / USERS_LOCKED_PASSWORD (the examples POM sets the public demo value).
users.standard.username=bob@example.com
users.locked.username=alice@example.com

# Android: wait for the main activity after the splash screen; grant runtime permissions up front
caps.android.appWaitActivity=com.saucelabs.mydemoapp.android.view.activities.*
caps.android.autoGrantPermissions=true
caps.android.disableWindowAnimation=true
