name: Android E2E

# Runs the example UI tests on an Android emulator (GitHub-hosted Linux runner with KVM).
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      suite:
        description: TestNG suite
        default: suites/smoke.xml

permissions:
  contents: read

concurrency:
  group: android-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      API_LEVEL: 34
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install Appium and the UiAutomator2 driver
        run: |
          npm install -g appium@3
          appium driver install uiautomator2

      - name: Download the demo app
        run: bash scripts/download-apps.sh android

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: AVD cache
        uses: actions/cache@v6
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.API_LEVEL }}

      - name: Create AVD snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: echo "AVD snapshot created"

      - name: Run UI tests on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            (appium --log-level warn > appium.log 2>&1 &)
            ./mvnw -B -ntp verify -Denv=android-local -Dsuite=${{ github.event.inputs.suite || 'suites/smoke.xml' }} -Dartifacts.video=on-failure

      - name: Generate Allure report
        if: always()
        run: ./mvnw -B -ntp -pl examples allure:report

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-allure-report
          path: examples/target/site/allure-maven-plugin
          retention-days: 14

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-logs
          path: |
            appium.log
            examples/target/taf-reports
          retention-days: 14

      - uses: actions/upload-pages-artifact@v5
        if: always() && github.ref == 'refs/heads/main'
        with:
          path: examples/target/site/allure-maven-plugin

  pages:
    needs: android
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
