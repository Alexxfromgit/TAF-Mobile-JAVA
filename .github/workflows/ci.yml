name: CI

# Device-free checks on every push: framework unit tests (screen model, drivers, sessions, mocking, reports)
# and the metadata linter over the example tests.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build, unit tests, static checks
        run: ./mvnw -B -ntp verify
